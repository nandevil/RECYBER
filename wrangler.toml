name = "recyber"
main = "worker.js"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./"
binding = "ASSETS"

# Bucket R2 pras fotos de peças/categorias — substitui o Supabase
# Storage (que cobra/bloqueia por tráfego). Egress do R2 é sempre
# grátis, então isso tira as fotos do que consumia a cota do Supabase.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "recyber-images"

# Não são segredo — @ público da InfinitePay, domínio base da API do
# Melhor Envio e o Client ID do app (não é sigiloso, só identifica a
# integração — quem é sigiloso é o Client Secret, que continua só
# como Secret no painel do Cloudflare, nunca aqui no código).
#
# O app foi criado em PRODUÇÃO (confirmado: sandbox retornava
# "invalid_client" na troca de token), por isso o domínio abaixo é o
# de produção, não o de sandbox.
#
# IMPORTANTE: qualquer variável de texto simples que você adicionar
# só pelo painel do Cloudflare (sem colocar aqui) SOME a cada novo
# deploy — o wrangler.toml é reaplicado inteiro a cada push. Secrets
# (tipo "Secret" no painel) não têm esse problema, só as "Text".
[vars]
INFINITEPAY_HANDLE = "recyber"
MELHORENVIO_BASE_URL = "https://melhorenvio.com.br"
MELHORENVIO_CLIENT_ID = "27198"
# URL pública do projeto Supabase — mesma já exposta no front-end
# (js/supabase-client.js), não é segredo. O que É segredo de verdade
# (SUPABASE_SERVICE_ROLE_KEY) continua só como Secret no painel do
# Cloudflare, nunca aqui.
SUPABASE_URL = "https://pzsbmenyseilagvbrnxn.supabase.co"
# URL pública do bucket R2 (Public Development URL) — usada pra montar
# o link de cada foto enviada pro R2. Não é segredo.
R2_PUBLIC_URL = "https://pub-ee5c472613004972ac0cf85f25dae701.r2.dev"
