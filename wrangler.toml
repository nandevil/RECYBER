name = "recyber"
main = "worker.js"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./"
binding = "ASSETS"

# Não são segredo — @ público da InfinitePay e o domínio base da API
# do Melhor Envio (troque pra "https://melhorenvio.com.br" quando
# confirmarmos que o app foi criado em produção, não sandbox).
[vars]
INFINITEPAY_HANDLE = "recyber"
MELHORENVIO_BASE_URL = "https://sandbox.melhorenvio.com.br"
